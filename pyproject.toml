# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-kconfig"
dynamic = ["version"]
description = "Configure a system from Kconfig option trees, checked with a SAT solver"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PacketFive" }]
keywords = [
  "kconfig", "menuconfig", "configuration", "sat", "solver", "reproducible-builds",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.6,<3"]

[project.urls]
Homepage = "https://github.com/PacketFive/trellis"
Source = "https://github.com/PacketFive/trellis"
Issues = "https://github.com/PacketFive/trellis/issues"

[dependency-groups]
# Everything the quality gates need, installed with "pip install --group dev"
# (pip 25.1 or later). Groups are not part of the package metadata, so the
# pybootstrap name on PyPI, which belongs to an unrelated placeholder, can be
# replaced by its repository here.
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
trellis = "trellis.cli:main"

[tool.setuptools.dynamic]
version = { attr = "trellis.__version__" }

# The repository's src directory is the trellis package itself; its
# subdirectories are the subpackages.
[tool.setuptools]
packages = ["trellis", "trellis.language", "trellis.logic", "trellis.solver", "trellis.ui"]
package-dir = { trellis = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
trellis = ["py.typed"]

# Quality gates, run with 'pybootstrap check'.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "trellis"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run programs, and test names describe themselves.
"tests/*" = ["S101", "S603", "S607", "D"]

# Tests import the installed package by name, since src/ has no
# trellis/ directory for ruff to discover it from.
[tool.ruff.lint.isort]
known-first-party = ["trellis"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
markers = [
  "requires_picosat: needs libpicosat, found through TRELLIS_PICOSAT or the system library path",
]
